  <!-- Prevent Vite HMR WebSocket errors -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      if (
        event.reason &&
        event.reason.message &&
        (
          event.reason.message.includes('WebSocket') ||
          event.reason.message.includes('wss://localhost:undefined')
        )
      ) {
        console.warn(
          '[VITE HMR] Suppressed WebSocket error:',
          event.reason.message
        );
        event.preventDefault();
      }
    });
  </script>

  <!-- Telegram fullscreen / visual setup -->
  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (!tg) return;

      try {
        if (typeof tg.ready === 'function') {
          tg.ready();
        }

        if (typeof tg.expand === 'function') {
          tg.expand();
        }

        if (typeof tg.setHeaderColor === 'function') {
          tg.setHeaderColor('#121212');
        }

        if (typeof tg.setBackgroundColor === 'function') {
          tg.setBackgroundColor('#121212');
        }

        if (typeof tg.requestFullscreen === 'function') {
          try {
            tg.requestFullscreen();
          } catch (e) {}
        }

        if (typeof tg.disableVerticalSwipes === 'function') {
          try {
            tg.disableVerticalSwipes();
          } catch (e) {}
        }

        try {
          var platform = tg.platform;
          var inset =
            tg.contentSafeAreaInset ||
            tg.safeAreaInset ||
            {};

          var top = inset.top || 0;

          if (
            platform === 'ios' &&
            top === 0 &&
            tg.isFullscreen
          ) {
            top = 47;
          }

          var bottom =
            platform === 'android'
              ? 16
              : (inset.bottom || 0);

          var rootStyle =
            document.documentElement.style;

          rootStyle.setProperty(
            '--safe-area-top',
            top + 'px'
          );

          rootStyle.setProperty(
            '--safe-area-bottom',
            bottom + 'px'
          );

          rootStyle.setProperty(
            '--tma-top-bar-height',
            (platform === 'ios' ? 52 : 48) + 'px'
          );

          rootStyle.setProperty(
            '--header-extra-offset',
            (platform === 'ios' ? 44 : 24) + 'px'
          );
        } catch (e) {}

        document.documentElement.style.setProperty(
          '--app-height',
          window.innerHeight + 'px'
        );

      } catch (e) {
        console.warn('[TELEGRAM] Setup warning:', e);
      }
    })();
  </script>

  <!-- Boot guard -->
  <script>
    (function () {

      var bootedByApp = false;

      function hideSplashEl() {
        var el =
          document.getElementById('splash');

        if (el && el.parentNode) {
          el.parentNode.removeChild(el);
        }
      }

      window.hideSplash = function () {
        bootedByApp = true;

        try {
          sessionStorage.removeItem(
            '__rkt_boot_reloaded'
          );
        } catch (e) {}

        hideSplashEl();
      };

      function rendered() {
        var root =
          document.getElementById('root');

        return !!(
          root &&
          root.childElementCount > 0
        );
      }

      function showFallback() {

        hideSplashEl();

        var root =
          document.getElementById('root');

        if (!root) return;

        root.innerHTML =
          '<div style="' +
          'position:fixed;' +
          'inset:0;' +
          'display:flex;' +
          'align-items:center;' +
          'justify-content:center;' +
          'background:#121212;' +
          'color:#fff;' +
          'font-family:-apple-system,system-ui,sans-serif;' +
          'padding:24px;' +
          'text-align:center">' +

          '<div style="max-width:300px">' +

          '<div style="font-size:44px;margin-bottom:16px">' +
          '🚀' +
          '</div>' +

          '<div style="' +
          'font-size:16px;' +
          'font-weight:600;' +
          'margin-bottom:8px">' +
          'Couldn’t load the game' +
          '</div>' +

          '<div style="' +
          'font-size:13px;' +
          'color:#9a9a9a;' +
          'margin-bottom:20px">' +
          'Check your connection and try again.' +
          '</div>' +

          '<button id="rkt-retry" style="' +
          'background:#8774E1;' +
          'color:#fff;' +
          'border:none;' +
          'padding:12px 24px;' +
          'border-radius:12px;' +
          'font-size:14px;' +
          'font-weight:600">' +
          'Reload' +
          '</button>' +

          '</div>' +
          '</div>';

        var button =
          document.getElementById('rkt-retry');

        if (button) {
          button.addEventListener(
            'click',
            function () {

              try {
                sessionStorage.removeItem(
                  '__rkt_boot_reloaded'
                );
              } catch (e) {}

              location.reload();
            }
          );
        }
      }

      setTimeout(function () {

        if (bootedByApp) {
          return;
        }

        if (rendered()) {

          try {
            sessionStorage.removeItem(
              '__rkt_boot_reloaded'
            );
          } catch (e) {}

          hideSplashEl();

          return;
        }

        var canReload = false;

        try {

          if (
            !sessionStorage.getItem(
              '__rkt_boot_reloaded'
            )
          ) {

            sessionStorage.setItem(
              '__rkt_boot_reloaded',
              '1'
            );

            canReload = true;
          }

        } catch (e) {}

        if (canReload) {
          location.reload();
          return;
        }

        showFallback();

      }, 8000);

    })();
  </script>

  function showStatistics(){api('/api/statistics').then(d=>openModal('▥ الإحصائيات',`<p>👥 اللاعبين: <b>${d.players}</b></p><p>🟢 المتصلين: <b>${d.online}</b></p><p>💎 إجمالي الأرصدة: <b>${fmt(d.totalBalance)} TON</b></p><p>👥 إجمالي الإحالات: <b>${d.totalReferrals}</b></p><p>⚔️ جولات PVP: <b>${d.pvpRounds}</b></p><p>🚀 جولات Rocket: <b>${d.rocketRounds}</b></p>`)).catch(e=>openModal('الإحصائيات',`<p>${esc(e.message)}</p>`))}
  async function showRanking(){try{const d=await api('/api/ranking');const rows=d.ranking.length?d.ranking.map((u,i)=>`<div style="display:grid;grid-template-columns:35px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #172233"><b>#${i+1}</b><div>${u.photo_url?`<img src="${esc(u.photo_url)}" style="width:30px;height:30px;border-radius:50%;vertical-align:middle;object-fit:cover"> `:''}<b>${esc(u.name)}</b><small style="display:block;color:#8d96a5">${u.wins} wins • ${u.games} games</small></div><strong>${fmt(u.balance)} TON</strong></div>`).join(''):'<p class="tx-muted">لا يوجد لاعبين بعد.</p>';openModal('♜ التصنيف',rows)}catch(e){openModal('♜ التصنيف',`<p>${esc(e.message)}</p>`)}}
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const p=b.dataset.go;if(p==='/invite')return showReferral();if(p==='/profile')return openModal('👤 الملف الشخصي',`${profileAvatar('72px')}<p><b>${esc(user.first_name||'Player')}</b></p><p>@${esc(user.username||'player')}</p><p>ID: <b>${esc(uid)}</b></p><p>الرصيد: <b>${fmt(balance)} TON</b></p>`);if(p==='/statistics')return showStatistics();if(p==='/leaderboard')return showRanking();if(p==='/gifts')return openModal('🎁 الهدايا',`<p>الصندوق المجاني يتجدد كل <b>8 ساعات</b>.</p><p>الجوائز: <b>10 • 20 • 35 • 50 • 75 • 100 • 250 • 350 • 500 TON</b></p>`);if(p==='/pvp')return goPvp();if(p==='/games')return openModal('🎮 الألعاب',`<p>🚀 Rocket</p><p>⚔️ PVP</p>`);go(p)});
  document.getElementById('rocket-btn').onclick=()=>go('/ton-rocket');
  document.getElementById('dev-nav').onclick=()=>{if(uid==='7795559285')return go('/developer');api('/api/admin/check-access').then(d=>d.isDeveloper?go('/developer'):alert('خاصة بالDev فقط')).catch(()=>alert('خاصة بالDev فقط'))};
  document.getElementById('ref-info').onclick=()=>openModal('Referral Progress','<p>كل لاعب جديد من رابطك = <b>50 TON</b>.</p>');document.getElementById('view-activity').onclick=()=>openModal('◷ النشاط','<p>سيتم عرض سجل عملياتك هنا مع التحديثات.</p>');

  function goPvp(){history.pushState({},'', '/pvp');location.reload()}
  function renderPvp(){
    setBack(true);const root=document.getElementById('root'),splash=document.getElementById('splash');if(!root)return;
    root.innerHTML=`<div style="min-height:100vh;background:#03070f;color:#fff;font-family:Poppins,system-ui,sans-serif;padding:72px 14px 100px;box-sizing:border-box"><div style="max-width:620px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">⚔️ PVP</h2><span id="pvp-time" style="font-size:24px;font-weight:900;color:#b88cff">15</span></div><div class="panel"><div class="small-label">الجائزة الحالية</div><div id="pvp-pot" style="font-size:32px;font-weight:900">0.00 TON</div><div class="small-label">المشاركون: <b id="pvp-count">0</b></div><div id="pvp-list" style="margin-top:10px"></div><label>مبلغ المشاركة</label><input id="pvp-amount" class="tx-input" type="number" min="0.01" step="0.01" placeholder="10"><div id="pvp-error" class="tx-error"></div><button id="pvp-join" class="tx-primary">⚔️ دخول الجولة</button></div><div class="panel" style="margin-top:12px"><div class="panel-heading">🏆 آخر النتائج</div><div id="pvp-history" class="tx-body" style="margin-top:8px">—</div></div></div></div>`;
    if(splash)splash.remove();let tick;
    async function refresh(){try{const d=await api('/api/pvp/state',{cache:'no-store'});const r=d.round;const time=document.getElementById('pvp-time');if(r){time.textContent=r.status==='open'?Math.ceil(r.remainingMs/1000):'0';document.getElementById('pvp-pot').textContent=fmt(r.pot)+' TON';document.getElementById('pvp-count').textContent=r.participants.length;document.getElementById('pvp-list').innerHTML=r.participants.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #172233"><span>${esc(p.name)}</span><b>${fmt(p.amount)} TON</b></div>`).join('');if(r.status==='finished'&&r.winnerId)document.getElementById('pvp-error').innerHTML=`🏆 الفائز: <b>${esc(r.winnerName)}</b> — ${fmt(r.pot)} TON`;}else{time.textContent='15';document.getElementById('pvp-pot').textContent='0.00 TON';document.getElementById('pvp-count').textContent='0';document.getElementById('pvp-list').innerHTML='<p class="tx-muted">بانتظار أول لاعب.</p>'}document.getElementById('pvp-history').innerHTML=(d.history||[]).map(h=>`<p>🏆 ${esc(h.winnerName||'Player')} — ${fmt(h.pot)} TON — ${h.players} لاعبين</p>`).join('')||'—'}catch(e){document.getElementById('pvp-error').textContent=e.message}}
    document.getElementById('pvp-join').onclick=async()=>{const amount=Number(document.getElementById('pvp-amount').value),err=document.getElementById('pvp-error');err.textContent='';try{const d=await api('/api/pvp/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatId:uid,amount})});err.textContent='✅ دخلت الجولة';refresh()}catch(e){err.textContent=e.message}};
    refresh();tick=setInterval(refresh,500);window.addEventListener('beforeunload',()=>clearInterval(tick));
  }

  async function renderDeveloper(){
    setBack(true);const root=document.getElementById('root'),splash=document.getElementById('splash');if(!root)return;
    if(uid!=='7795559285'){root.innerHTML='<div style="min-height:100vh;background:#121212;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Poppins,system-ui;padding:24px;text-align:center"><div><div style="font-size:48px">🔒</div><h2>خاصة بالDev فقط</h2><button id="dev-home" class="tx-primary">Back</button></div></div>';splash?.remove();document.getElementById('dev-home').onclick=goHome;return;}
    let stats={};try{stats=await api('/api/statistics')}catch(e){}
    root.innerHTML=`<div style="min-height:100vh;background:#121212;color:#fff;font-family:Poppins,system-ui,sans-serif;padding:70px 16px 30px;max-width:600px;margin:auto"><div style="background:linear-gradient(145deg,#242424,#171717);border:1px solid #5b3aa8;border-radius:20px;padding:20px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">🔐 لوحة Dev</h2><b style="color:#b895ff">DEVELOPER</b></div><p style="color:#aaa">Telegram ID: ${esc(uid)}</p><div id="dev-balance" style="font-size:28px;font-weight:800;margin:18px 0">500.00 TON</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="devx" data-act="users">👥 المستخدمين</button><button class="devx" data-act="balances">💰 الأرصدة</button><button class="devx" data-act="games">🎮 الألعاب</button><button class="devx" data-act="rocket">🚀 Rocket</button><button class="devx" data-act="activity">📝 النشاط</button><button class="devx" data-act="settings">⚙️ الإعدادات</button></div><div style="margin-top:14px;color:#aaa;font-size:13px">Players: ${stats.players||0} • Online: ${stats.online||0}</div></div><button id="dev-back" style="width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1px solid #444;background:#202020;color:#fff;font-weight:800">‹ Back to Home</button></div><style>.devx{padding:14px;border-radius:13px;border:1px solid #3b3b3b;background:#222;color:#fff;font-weight:800}.devx:active{transform:scale(.98)}</style>`;
    splash?.remove();document.getElementById('dev-back').onclick=goHome;
    document.querySelectorAll('.devx').forEach(b=>b.onclick=()=>devAction(b.dataset.act));
  }
  async function devAction(act){
    try{
      if(act==='users'){const d=await api('/api/admin/users');openModal('👥 المستخدمين',d.users.map(u=>`<div style="padding:8px 0;border-bottom:1px solid #172233"><b>${esc(u.name)}</b> <small>@${esc(u.username)}</small><br>ID: ${u.id} • ${fmt(u.balance)} TON • ${u.wins} wins</div>`).join('')||'<p>لا يوجد مستخدمين</p>');return}
      if(act==='balances'){const m=openModal('💰 الأرصدة',`<label>Telegram ID</label><input id="adm-id" class="tx-input"><label>المبلغ</label><input id="adm-amount" class="tx-input" type="number" step="0.01"><select id="adm-action" class="tx-input"><option value="add">إضافة</option><option value="set">تعيين</option><option value="reset">تصفير</option></select>`,'<button id="adm-send" class="tx-primary">تنفيذ</button>');m.querySelector('#adm-send').onclick=async()=>{try{const d=await api('/api/admin/balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetId:m.querySelector('#adm-id').value.trim(),amount:Number(m.querySelector('#adm-amount').value),action:m.querySelector('#adm-action').value})});openModal('✅ الأرصدة',`<p>الرصيد الجديد: <b>${fmt(d.balance)} TON</b></p>`)}catch(e){alert(e.message)}};return}
      if(act==='games'||act==='rocket'){openModal(act==='rocket'?'🚀 Rocket':'🎮 الألعاب',`<p>حالة Rocket: <b>تعمل</b></p><p>الحسابات واللعبة تستخدم <b>رصيدًا افتراضيًا</b>.</p><p>يمكننا إضافة إعدادات الجولة من هنا لاحقًا.</p>`);return}
      if(act==='activity'){const d=await api('/api/admin/activity');openModal('📝 النشاط',d.activity.map(a=>`<div style="padding:7px 0;border-bottom:1px solid #172233"><b>${esc(a.type)}</b> — ${esc(a.message)}<small style="display:block;color:#8d96a5">${esc(a.at)}</small></div>`).join('')||'<p>لا يوجد نشاط بعد.</p>');return}
      if(act==='settings'){const d=await api('/api/admin/settings');openModal('⚙️ الإعدادات',`<p>بداية اللاعب: <b>${d.settings.startingBalance} TON</b></p><p>مكافأة الإحالة: <b>${d.settings.referralReward} TON</b></p><p>Free Gift: <b>${d.settings.freeGiftCooldownHours} ساعات</b></p><p>جوائز Free Gift: <b>${d.settings.freeGiftAmounts.join(' • ')}</b></p><p>PVP: <b>${d.settings.pvpRoundSeconds} ثانية</b></p>`);return}
    }catch(e){alert(e.message||'خطأ')}
  }
})();
</script>
</body>
    </html>
