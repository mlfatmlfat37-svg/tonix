  <!-- Prevent Vite HMR WebSocket errors -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      if (
        event.reason &&
        event.reason.message &&
        (
          event.reason.message.includes('WebSocket') ||
          event.reason.message.includes('wss://localhost:undefined')
        )
      ) {
        console.warn(
          '[VITE HMR] Suppressed WebSocket error:',
          event.reason.message
        );
        event.preventDefault();
      }
    });
  </script>

  <!-- Telegram fullscreen / visual setup -->
  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (!tg) return;

      try {
        if (typeof tg.ready === 'function') {
          tg.ready();
        }

        if (typeof tg.expand === 'function') {
          tg.expand();
        }

        if (typeof tg.setHeaderColor === 'function') {
          tg.setHeaderColor('#121212');
        }

        if (typeof tg.setBackgroundColor === 'function') {
          tg.setBackgroundColor('#121212');
        }

        if (typeof tg.requestFullscreen === 'function') {
          try {
            tg.requestFullscreen();
          } catch (e) {}
        }

        if (typeof tg.disableVerticalSwipes === 'function') {
          try {
            tg.disableVerticalSwipes();
          } catch (e) {}
        }

        try {
          var platform = tg.platform;
          var inset =
            tg.contentSafeAreaInset ||
            tg.safeAreaInset ||
            {};

          var top = inset.top || 0;

          if (
            platform === 'ios' &&
            top === 0 &&
            tg.isFullscreen
          ) {
            top = 47;
          }

          var bottom =
            platform === 'android'
              ? 16
              : (inset.bottom || 0);

          var rootStyle =
            document.documentElement.style;

          rootStyle.setProperty(
            '--safe-area-top',
            top + 'px'
          );

          rootStyle.setProperty(
            '--safe-area-bottom',
            bottom + 'px'
          );

          rootStyle.setProperty(
            '--tma-top-bar-height',
            (platform === 'ios' ? 52 : 48) + 'px'
          );

          rootStyle.setProperty(
            '--header-extra-offset',
            (platform === 'ios' ? 44 : 24) + 'px'
          );
        } catch (e) {}

        document.documentElement.style.setProperty(
          '--app-height',
          window.innerHeight + 'px'
        );

      } catch (e) {
        console.warn('[TELEGRAM] Setup warning:', e);
      }
    })();
  </script>

  <!-- Boot guard -->
  <script>
    (function () {

      var bootedByApp = false;

      function hideSplashEl() {
        var el =
          document.getElementById('splash');

        if (el && el.parentNode) {
          el.parentNode.removeChild(el);
        }
      }

      window.hideSplash = function () {
        bootedByApp = true;

        try {
          sessionStorage.removeItem(
            '__rkt_boot_reloaded'
          );
        } catch (e) {}

        hideSplashEl();
      };

      function rendered() {
        var root =
          document.getElementById('root');

        return !!(
          root &&
          root.childElementCount > 0
        );
      }

      function showFallback() {

        hideSplashEl();

        var root =
          document.getElementById('root');

        if (!root) return;

        root.innerHTML =
          '<div style="' +
          'position:fixed;' +
          'inset:0;' +
          'display:flex;' +
          'align-items:center;' +
          'justify-content:center;' +
          'background:#121212;' +
          'color:#fff;' +
          'font-family:-apple-system,system-ui,sans-serif;' +
          'padding:24px;' +
          'text-align:center">' +

          '<div style="max-width:300px">' +

          '<div style="font-size:44px;margin-bottom:16px">' +
          '🚀' +
          '</div>' +

          '<div style="' +
          'font-size:16px;' +
          'font-weight:600;' +
          'margin-bottom:8px">' +
          'Couldn’t load the game' +
          '</div>' +

          '<div style="' +
          'font-size:13px;' +
          'color:#9a9a9a;' +
          'margin-bottom:20px">' +
          'Check your connection and try again.' +
          '</div>' +

          '<button id="rkt-retry" style="' +
          'background:#8774E1;' +
          'color:#fff;' +
          'border:none;' +
          'padding:12px 24px;' +
          'border-radius:12px;' +
          'font-size:14px;' +
          'font-weight:600">' +
          'Reload' +
          '</button>' +

          '</div>' +
          '</div>';

        var button =
          document.getElementById('rkt-retry');

        if (button) {
          button.addEventListener(
            'click',
            function () {

              try {
                sessionStorage.removeItem(
                  '__rkt_boot_reloaded'
                );
              } catch (e) {}

              location.reload();
            }
          );
        }
      }

      setTimeout(function () {

        if (bootedByApp) {
          return;
        }

        if (rendered()) {

          try {
            sessionStorage.removeItem(
              '__rkt_boot_reloaded'
            );
          } catch (e) {}

          hideSplashEl();

          return;
        }

        var canReload = false;

        try {

          if (
            !sessionStorage.getItem(
              '__rkt_boot_reloaded'
            )
          ) {

            sessionStorage.setItem(
              '__rkt_boot_reloaded',
              '1'
            );

            canReload = true;
          }

        } catch (e) {}

        if (canReload) {
          location.reload();
          return;
        }

        showFallback();

      }, 8000);

    })();
  </script>
